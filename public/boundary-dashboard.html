<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATRIYA — Boundary Dashboard</title>
<style>
  :root{--bg:#0f1419;--card:#1a2230;--ink:#e6edf3;--mut:#8b98a9;--ok:#2ea043;--warn:#d29922;--miss:#f85149;--acc:#3b82f6}
  *{box-sizing:border-box} body{margin:0;font-family:Arial,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  header{padding:16px 20px;border-bottom:1px solid #2a3441;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  h1{font-size:18px;margin:0} select{background:var(--card);color:var(--ink);border:1px solid #2a3441;border-radius:8px;padding:8px 12px;font-size:15px}
  .banner{background:#3a2a12;color:#f0c674;padding:8px 20px;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:20px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid #2a3441;border-radius:12px;padding:16px}
  .card h2{font-size:14px;margin:0 0 12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
  .row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #222b38;font-size:14px}
  .row:last-child{border:0} .tag{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .ok{background:rgba(46,160,67,.15);color:var(--ok)} .warn{background:rgba(210,153,34,.15);color:var(--warn)}
  .miss{background:rgba(248,81,73,.15);color:var(--miss)} .gap{background:rgba(59,130,246,.15);color:var(--acc)}
  .big{font-size:26px;font-weight:700} .mut{color:var(--mut);font-size:13px}
  .empty{color:var(--mut);font-size:13px;font-style:italic}
</style>
</head>
<body>
<header>
  <h1>🎯 MATRIYA — Boundary Dashboard</h1>
  <select id="proj" onchange="render()"></select>
  <span id="mode" class="mut"></span>
</header>
<div id="banner"></div>
<div class="grid">
  <div class="card"><h2>בדיקות הפרויקט</h2><div id="tests"></div></div>
  <div class="card"><h2>פער עבודה — ניתן למדוד, לא נמדד</h2><div id="gap"></div></div>
  <div class="card"><h2>גבולות שנגזרו</h2><div id="bnd"></div></div>
</div>

<script>
// Demo data (renders offline; replaced by live API when reachable + token).
const DEMO = {
  "INT-TFX": {
    tests:{done:["pH","specific gravity","viscosity","primer DFT","paint DFT","substrate","burn profile","Fire Resistance Time","PASS/FAIL"],
      planned:["Cross Hatch (before/after)","Pull Off (before/after)"], missing:["Expansion Ratio","Foam Uniformity","Adhesion After Burn","Visual Change"]},
    gap:["pull_off_adhesion","expansion_ratio"],
    boundaries:[{name:"expansion/adhesion",status:"hypothesis",note:"לא נמדד עדיין — expansion+adhesion חסרים"}]},
  "FIRE_RETARDANT_PLASTER": {
    tests:{done:["Expansion Ratio","Foam Uniformity","Density","Fire Resistance Time","Char Integrity","Cracking","PASS/FAIL"],
      planned:["Adhesion to Substrate","Thermal Conductivity"], missing:[]},
    gap:[],
    boundaries:[{name:"density → fire-time",status:"ready",note:"מחכה לסריקת צפיפות (template מוכן)"}]},
  "PR-TFX": {
    tests:{done:["pH","specific gravity","viscosity","corrosion (hours)","corrosion (level)"],
      planned:["Cross Hatch","Blistering","Rust Grade","Delamination"], missing:[]},
    gap:["pull_off_adhesion"],
    boundaries:[{name:"K-silicate × primer (incompatibility)",status:"partial_verified",note:"INCOMP-001: שוק בכל הסוגים/דילולים; בידוד רכיב = הצעד הבא"}]}
};
const TOKEN = new URLSearchParams(location.search).get("token");
let DATA = JSON.parse(JSON.stringify(DEMO)), LIVE = false;

async function tryLive(){
  if(!TOKEN) return false;
  try{
    const h={Authorization:"Bearer "+TOKEN};
    const projs=await (await fetch("/api/project-tests",{headers:h})).json();
    if(!projs.projects) return false;
    DATA={};
    for(const p of projs.projects){
      const cov=await (await fetch("/api/coverage?project="+encodeURIComponent(p.id),{headers:h})).json();
      DATA[p.id]={tests:{done:p.done.map(t=>t.test),planned:p.planned.map(t=>t.test),missing:p.missing.map(t=>t.test)},
        gap:(cov.work_gap||[]),boundaries:[]};
    }
    return true;
  }catch(e){ return false; }
}
function statusTag(s){const m={ready:"gap",partial_verified:"ok",hypothesis:"warn"};return m[s]||"warn";}
function render(){
  const id=document.getElementById("proj").value, d=DATA[id]||{tests:{done:[],planned:[],missing:[]},gap:[],boundaries:[]};
  const T=d.tests;
  const li=(arr,cls,tag)=>arr.length?arr.map(x=>`<div class="row"><span>${x}</span><span class="tag ${cls}">${tag}</span></div>`).join(""):'<div class="empty">—</div>';
  document.getElementById("tests").innerHTML=li(T.done,"ok","מבוצע")+li(T.planned,"warn","מתוכנן")+li(T.missing,"miss","חסר");
  document.getElementById("gap").innerHTML = d.gap.length
    ? `<div class="big">${d.gap.length}</div><div class="mut">צירים שהמעבדה יכולה למדוד אבל הפרויקט לא:</div>`+d.gap.map(g=>`<div class="row"><span>${g}</span><span class="tag gap">להתחיל למדוד</span></div>`).join("")
    : '<div class="empty">אין פער — כל הצירים המדידים נמדדים ✓</div>';
  document.getElementById("bnd").innerHTML = (d.boundaries&&d.boundaries.length)
    ? d.boundaries.map(b=>`<div class="row"><span>${b.name}<div class="mut">${b.note}</div></span><span class="tag ${statusTag(b.status)}">${b.status}</span></div>`).join("")
    : '<div class="empty">טרם נגזר גבול</div>';
}
(async()=>{
  LIVE=await tryLive();
  document.getElementById("mode").textContent = LIVE?"● live":"● demo data";
  document.getElementById("banner").className = LIVE?"":"banner";
  document.getElementById("banner").textContent = LIVE?"":"מצב הדגמה — הוסף ?token=<JWT> ל-URL לנתונים חיים.";
  const sel=document.getElementById("proj");
  sel.innerHTML=Object.keys(DATA).map(k=>`<option>${k}</option>`).join("");
  render();
})();
</script>
</body>
</html>
