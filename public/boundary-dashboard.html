<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATRIYA — Boundary Dashboard</title>
<style>
  :root{--bg:#0f1419;--card:#1a2230;--ink:#e6edf3;--mut:#8b98a9;--ok:#2ea043;--warn:#d29922;--miss:#f85149;--acc:#3b82f6}
  *{box-sizing:border-box} body{margin:0;font-family:Arial,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  header{padding:16px 20px;border-bottom:1px solid #2a3441;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  h1{font-size:18px;margin:0} select{background:var(--card);color:var(--ink);border:1px solid #2a3441;border-radius:8px;padding:8px 12px;font-size:15px}
  .banner{background:#3a2a12;color:#f0c674;padding:8px 20px;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:20px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid #2a3441;border-radius:12px;padding:16px}
  .card h2{font-size:14px;margin:0 0 12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
  .row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #222b38;font-size:14px}
  .row:last-child{border:0} .tag{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .ok{background:rgba(46,160,67,.15);color:var(--ok)} .warn{background:rgba(210,153,34,.15);color:var(--warn)}
  .miss{background:rgba(248,81,73,.15);color:var(--miss)} .gap{background:rgba(59,130,246,.15);color:var(--acc)}
  .big{font-size:26px;font-weight:700} .mut{color:var(--mut);font-size:13px}
  .empty{color:var(--mut);font-size:13px;font-style:italic}
  .btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
  .btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<header>
  <h1>🎯 MATRIYA — Boundary Dashboard</h1>
  <select id="proj" onchange="render()"></select>
  <span id="mode" class="mut"></span>
  <label class="btn" id="ingestBtn" title="העלאת CSV של תצפיות (תבנית המעבדה) — נכנס דרך אותו שער חוזה">
    ⬆ העלאת תצפיות (CSV)
    <input id="csvFile" type="file" accept=".csv,text/csv" style="display:none">
  </label>
  <span id="ingestMsg" class="mut"></span>
</header>
<div id="banner"></div>
<div id="ingestPanel" style="padding:0 20px"></div>
<div class="grid">
  <div class="card"><h2>בדיקות הפרויקט</h2><div id="tests"></div></div>
  <div class="card"><h2>פער עבודה — ניתן למדוד, לא נמדד</h2><div id="gap"></div></div>
  <div class="card"><h2>גבולות שנגזרו</h2><div id="bnd"></div></div>
  <div class="card" style="grid-column:1/-1"><h2>מפת הגבול</h2><div id="chart"></div></div>
</div>

<script>
// Demo data (renders offline; replaced by live API when reachable + token).
const DEMO = {
  "INT-TFX": {
    tests:{done:["pH","specific gravity","viscosity","primer DFT","paint DFT","substrate","burn profile","Fire Resistance Time","PASS/FAIL"],
      planned:["Cross Hatch (before/after)","Pull Off (before/after)"], missing:["Expansion Ratio","Foam Uniformity","Adhesion After Burn","Visual Change"]},
    gap:["pull_off_adhesion","expansion_ratio"],
    boundaries:[{name:"expansion/adhesion",status:"hypothesis",note:"לא נמדד עדיין — expansion+adhesion חסרים"}]},
  "FIRE_RETARDANT_PLASTER": {
    tests:{done:["Expansion Ratio","Foam Uniformity","Density","Fire Resistance Time","Char Integrity","Cracking","PASS/FAIL"],
      planned:["Adhesion to Substrate","Thermal Conductivity"], missing:[]},
    gap:[],
    boundaries:[{name:"density → fire-time",status:"ready",note:"דמו: גבול ב-120 kg/m³ (CI ±6)"}],
    chart:{xLabel:"char density (kg/m³)",yLabel:"time to failure (min)",spec:60,boundary:120,ci:[113.8,126.2],
      points:[{x:90,y:44,o:"fail"},{x:110,y:54,o:"fail"},{x:130,y:66,o:"work"},{x:150,y:80,o:"work"},{x:170,y:92,o:"work"}]}},
  "PR-TFX": {
    tests:{done:["pH","specific gravity","viscosity","corrosion (hours)","corrosion (level)"],
      planned:["Cross Hatch","Blistering","Rust Grade","Delamination"], missing:[]},
    gap:["pull_off_adhesion"],
    boundaries:[{name:"K-silicate × primer (incompatibility)",status:"partial_verified",note:"INCOMP-001: שוק בכל הסוגים/דילולים; בידוד רכיב = הצעד הבא"}]}
};
const TOKEN = new URLSearchParams(location.search).get("token");
let DATA = JSON.parse(JSON.stringify(DEMO)), LIVE = false;
// per-project numeric scan config: which axes form the boundary + spec (T_relevance)
const CHARTCFG = { FIRE_RETARDANT_PLASTER:{response_axis:"time_to_failure",input_axis:"density",spec:60,mme:1.87} };

async function tryLive(){
  if(!TOKEN) return false;
  try{
    const h={Authorization:"Bearer "+TOKEN};
    const projs=await (await fetch("/api/project-tests",{headers:h})).json();
    if(!projs.projects) return false;
    DATA={};
    for(const p of projs.projects){
      const cov=await (await fetch("/api/coverage?project="+encodeURIComponent(p.id),{headers:h})).json();
      DATA[p.id]={tests:{done:p.done.map(t=>t.test),planned:p.planned.map(t=>t.test),missing:p.missing.map(t=>t.test)},
        gap:(cov.work_gap||[]),boundaries:[],chart:null};
      // live boundary from deriveBoundary (only where a scan config exists)
      const cfg=CHARTCFG[p.id];
      if(cfg){
        const qs=`project=${encodeURIComponent(p.id)}&response_axis=${cfg.response_axis}&input_axis=${cfg.input_axis}&spec=${cfg.spec}${cfg.mme?`&mme=${cfg.mme}`:""}`;
        const b=await (await fetch("/api/boundaries?"+qs,{headers:h})).json();
        if(b && b.n_points>0){
          DATA[p.id].chart={xLabel:cfg.input_axis,yLabel:cfg.response_axis,spec:b.spec,
            boundary:b.boundary?.boundary,ci:b.boundary?.confidence_interval||[b.boundary?.boundary,b.boundary?.boundary],points:b.points};
          DATA[p.id].boundaries=[{name:`${cfg.input_axis} → ${cfg.response_axis}`,
            status:b.boundary?.bracketed?(b.boundary?.separable?"partial_verified":"hypothesis"):"hypothesis",
            note:`live: ${b.n_points} נקודות, גבול ${b.boundary?.boundary??"—"}`}];
        }
      }
    }
    return true;
  }catch(e){ return false; }
}
function statusTag(s){const m={ready:"gap",partial_verified:"ok",hypothesis:"warn"};return m[s]||"warn";}
function render(){
  const id=document.getElementById("proj").value, d=DATA[id]||{tests:{done:[],planned:[],missing:[]},gap:[],boundaries:[]};
  const T=d.tests;
  const li=(arr,cls,tag)=>arr.length?arr.map(x=>`<div class="row"><span>${x}</span><span class="tag ${cls}">${tag}</span></div>`).join(""):'<div class="empty">—</div>';
  document.getElementById("tests").innerHTML=li(T.done,"ok","מבוצע")+li(T.planned,"warn","מתוכנן")+li(T.missing,"miss","חסר");
  document.getElementById("gap").innerHTML = d.gap.length
    ? `<div class="big">${d.gap.length}</div><div class="mut">צירים שהמעבדה יכולה למדוד אבל הפרויקט לא:</div>`+d.gap.map(g=>`<div class="row"><span>${g}</span><span class="tag gap">להתחיל למדוד</span></div>`).join("")
    : '<div class="empty">אין פער — כל הצירים המדידים נמדדים ✓</div>';
  document.getElementById("bnd").innerHTML = (d.boundaries&&d.boundaries.length)
    ? d.boundaries.map(b=>`<div class="row"><span>${b.name}<div class="mut">${b.note}</div></span><span class="tag ${statusTag(b.status)}">${b.status}</span></div>`).join("")
    : '<div class="empty">טרם נגזר גבול</div>';
  document.getElementById("chart").innerHTML = d.chart ? renderChart(d.chart) : '<div class="empty">אין סריקה מספרית עדיין — יתמלא כשתגיע סריקת צפיפות/קלט מספרי.</div>';
}
function renderChart(c){
  const W=720,H=300,pad=46;
  const xs=c.points.map(p=>p.x), ys=c.points.map(p=>p.y);
  const hasB=Number.isFinite(c.boundary);
  const xmin=Math.min(...xs,hasB?c.boundary:xs[0])-10, xmax=Math.max(...xs,hasB?c.boundary:xs[0])+10;
  const ymin=Math.min(...ys,c.spec)-8, ymax=Math.max(...ys,c.spec)+8;
  const X=v=>pad+(v-xmin)/(xmax-xmin)*(W-2*pad);
  const Y=v=>H-pad-(v-ymin)/(ymax-ymin)*(H-2*pad);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:760px">`;
  // CI band + boundary line (vertical, on input axis) — only if a boundary was derived
  if(hasB){
    if(c.ci&&Number.isFinite(c.ci[0])&&c.ci[1]>c.ci[0]) s+=`<rect x="${X(c.ci[0])}" y="${pad}" width="${X(c.ci[1])-X(c.ci[0])}" height="${H-2*pad}" fill="rgba(59,130,246,.15)"/>`;
    s+=`<line x1="${X(c.boundary)}" y1="${pad}" x2="${X(c.boundary)}" y2="${H-pad}" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5 4"/>`;
    s+=`<text x="${X(c.boundary)}" y="${pad-6}" fill="#3b82f6" font-size="12" text-anchor="middle">boundary ${c.boundary}</text>`;
  }
  // spec line (horizontal)
  s+=`<line x1="${pad}" y1="${Y(c.spec)}" x2="${W-pad}" y2="${Y(c.spec)}" stroke="#d29922" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  s+=`<text x="${W-pad}" y="${Y(c.spec)-5}" fill="#d29922" font-size="11" text-anchor="end">spec ${c.spec} min</text>`;
  // axes
  s+=`<line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#2a3441"/><line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="#2a3441"/>`;
  s+=`<text x="${W/2}" y="${H-8}" fill="#8b98a9" font-size="12" text-anchor="middle">${c.xLabel}</text>`;
  s+=`<text x="14" y="${H/2}" fill="#8b98a9" font-size="12" text-anchor="middle" transform="rotate(-90,14,${H/2})">${c.yLabel}</text>`;
  // points
  for(const p of c.points){const col=p.o==="work"?"#2ea043":"#f85149";
    s+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="6" fill="${col}"/><text x="${X(p.x)}" y="${Y(p.y)-10}" fill="#8b98a9" font-size="10" text-anchor="middle">${p.y}</text>`;}
  s+=`</svg><div class="mut" style="margin-top:6px">🟢 works · 🔴 fails · — — spec · ▮ boundary ±CI. הגבול נגזר: σ=MME/שיפוע.</div>`;
  return s;
}
// CSV ingest — a two-step gate that turns raw lab data into trusted evidence:
//   1) Preview (dry-run): parse + validate through the contract, write NOTHING, show
//      detected/valid/rejected (+reasons) and any new materials/unknown axes → "Proceed?"
//   2) Import: insert, then show a value-returning summary (contradictions, boundary
//      candidates) and refresh the chart. Same parser + contract gate as the CLI.
let pendingCsv=null;
function setMsg(text,color){const m=document.getElementById("ingestMsg");m.style.color=color||"var(--mut)";m.textContent=text||"";}
function ingestErr(j,r){
  if(j&&j.rejected_detail&&j.rejected_detail.length){
    const f=j.rejected_detail[0];
    setMsg(`✗ ${j.rejected} שורות נדחו (שורה ${(f.index??0)+1}: ${(f.errors||[]).join("; ")})`,"#f85149");
  } else setMsg("✗ "+((j&&j.error)||("שגיאה "+(r&&r.status))),"#f85149");
}
async function previewCsv(file){
  if(!TOKEN){ setMsg("נדרש ?token=<JWT> ל-URL כדי להעלות.","#f85149"); return; }
  setMsg("בודק "+file.name+"…");
  try{
    pendingCsv=await file.text();
    const r=await fetch("/api/observations/import-csv?dry_run=1",{method:"POST",
      headers:{Authorization:"Bearer "+TOKEN,"Content-Type":"text/csv"},body:pendingCsv});
    const j=await r.json().catch(()=>({}));
    if(!r.ok && !j.dry_run){ ingestErr(j,r); return; }
    setMsg("");
    renderPreview(j,file.name);
  }catch(e){ setMsg("✗ "+e.message,"#f85149"); }
}
function srow(label,val,cls){return `<div class="row"><span>${label}</span><span class="tag ${cls||'ok'}">${val}</span></div>`;}
function renderPreview(j,name){
  const rej=(j.rejected_detail||[]).slice(0,6).map(x=>
    `<div class="row"><span>שורה ${(x.index??0)+1}</span><span class="tag miss">${(x.errors||[]).join("; ")}</span></div>`).join("");
  document.getElementById("ingestPanel").innerHTML=`<div class="card">
    <h2>תצוגה מקדימה — ${name}</h2>
    <div class="row"><span>זוהו תצפיות</span><span class="big">${j.detected}</span></div>
    ${srow("✓ תקינות (יכנסו)",j.valid,j.valid?"ok":"warn")}
    ${srow("⚠ נדחו",j.rejected,j.rejected?"miss":"ok")}
    ${j.new_materials&&j.new_materials.length?srow("חומרים חדשים (אין זהות קנונית)",j.new_materials.join(", "),"warn"):""}
    ${j.new_axes&&j.new_axes.length?srow("צירים לא מוכרים",j.new_axes.join(", "),"miss"):""}
    ${rej}
    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="btn" onclick="confirmImport()" ${j.valid?"":'aria-disabled="true" disabled'}>✓ אישור וייבוא (${j.valid})</button>
      <button class="btn" style="background:#2a3441" onclick="cancelImport()">ביטול</button>
    </div>
    <div class="mut" style="margin-top:8px">שום דבר לא נשמר עד אישור. זהו שער ה-Raw Data → Trusted Evidence.</div></div>`;
}
async function confirmImport(){
  if(!pendingCsv){ cancelImport(); return; }
  setMsg("מייבא…");
  try{
    const r=await fetch("/api/observations/import-csv",{method:"POST",
      headers:{Authorization:"Bearer "+TOKEN,"Content-Type":"text/csv"},body:pendingCsv});
    const j=await r.json().catch(()=>({}));
    pendingCsv=null;
    if(!r.ok){ ingestErr(j,r); document.getElementById("ingestPanel").innerHTML=""; return; }
    setMsg("");
    renderSummary(j);
    LIVE=await tryLive();      // refresh from DB so the chart reflects the new observations
    render();
  }catch(e){ setMsg("✗ "+e.message,"#f85149"); }
}
function renderSummary(j){
  const nm=(j.new_materials||[]).length, na=(j.new_axes||[]).length;
  const cd=j.contradictions_detected, bc=j.boundary_candidates;
  document.getElementById("ingestPanel").innerHTML=`<div class="card">
    <h2>✓ הייבוא הושלם — מה חזר למעבדה</h2>
    ${srow("נקלטו תצפיות",j.inserted,"ok")}
    ${srow("נדחו",j.rejected||0,(j.rejected?"miss":"ok"))}
    ${srow("חומרים חדשים",nm,nm?"warn":"ok")}
    ${srow("צירים חדשים",na,na?"miss":"ok")}
    ${srow("סתירות שזוהו",cd==null?"—":cd,cd?"warn":"ok")}
    ${srow("מועמדים לגבול (Works∧Fails)",bc==null?"—":bc,bc?"gap":"ok")}
    <div style="margin-top:10px;display:flex;gap:8px">
      <button class="btn" style="background:#2a3441" onclick="cancelImport()">סגור</button>
    </div>
    ${(cd==null&&bc==null)?'<div class="mut" style="margin-top:8px">סיכום הגבול/הסתירות יופיע כשטבלת observations תהיה חיה (migration 007).</div>':""}</div>`;
}
function cancelImport(){ pendingCsv=null; document.getElementById("ingestPanel").innerHTML=""; setMsg(""); }

(async()=>{
  LIVE=await tryLive();
  document.getElementById("mode").textContent = LIVE?"● live":"● demo data";
  document.getElementById("banner").className = LIVE?"":"banner";
  document.getElementById("banner").textContent = LIVE?"":"מצב הדגמה — הוסף ?token=<JWT> ל-URL לנתונים חיים.";
  const sel=document.getElementById("proj");
  sel.innerHTML=Object.keys(DATA).map(k=>`<option>${k}</option>`).join("");
  render();
  // wire the ingest button (disabled visual hint when no token)
  const btn=document.getElementById("ingestBtn"), inp=document.getElementById("csvFile");
  if(!TOKEN){ btn.setAttribute("aria-disabled","true"); btn.title="נדרש ?token=<JWT> ל-URL כדי להעלות"; }
  inp.addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; if(f) previewCsv(f); inp.value=""; });
})();
</script>
</body>
</html>
